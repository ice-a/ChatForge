name: Release · 全平台自动构建发布

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本与 Release 标签
        id: ver
        shell: bash
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            PRERELEASE=false
            TITLE="ChatForge $TAG 🔥"
          else
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
            PRERELEASE=true
            TITLE="ChatForge v${VERSION} 开发构建 #${GITHUB_RUN_NUMBER} ⚒️"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG (prerelease=$PRERELEASE)"

  create-release:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## ChatForge · 会话锻造厂 ${{ needs.meta.outputs.tag }}

            > 🔥 炼尽千条会话，铸一个更懂你的 AI 分身

            | 平台 | 产物 |
            | --- | --- |
            | Windows | `ChatForge_*_x64-setup.exe` / `.msi` |
            | macOS (Apple Silicon) | `ChatForge_*_aarch64.dmg` |
            | Linux (x64) | `.deb` / `.AppImage` / `.rpm` |

            装好后打开应用 → 「扫描全部来源」→ 仪表盘 / 会话库 / 用户画像 / 蒸馏大师。
            需要 Rust 1.77+；从源码构建见 README。

  build:
    needs: [meta, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            target: aarch64-apple-darwin
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/rpm/*.rpm

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本读取 package.json 的 packageManager 字段，与本机一致

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 依赖（Tauri）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: 安装前端依赖
        run: pnpm install

      - name: 构建 Tauri 应用
        run: pnpm tauri build

      - name: 列出打包产物（调试）
        shell: bash
        run: |
          echo "=== bundle 产物 ==="
          find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -exec ls -lh {} \; || true

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          files: ${{ matrix.artifacts }}
